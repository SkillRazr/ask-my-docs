# PostgreSQL with pgvector. The schema in sql/ is created on first start.
services:
  db:
    image: pgvector/pgvector:pg16
    container_name: ask-my-docs-db
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./sql:/docker-entrypoint-initdb.d
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
