# Counts the "guardrail" log lines from src/gateway/events.ts, by kind.
description: Guardrail events, by kind
filter: jsonPayload.message="guardrail"
labelExtractors:
  kind: EXTRACT(jsonPayload.kind)
metricDescriptor:
  metricKind: DELTA
  valueType: INT64
  labels:
    - key: kind
      valueType: STRING
